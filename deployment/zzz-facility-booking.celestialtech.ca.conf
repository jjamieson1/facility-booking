# Facility Booking (Rivermont Spaces) — Apache vhost.
#
# Filename is zzz-* on purpose: conf.d loads alphabetically, and the FIRST vhost
# becomes the server's default. Loading LAST guarantees we never silently take
# over the shared host's existing default vhost (skills/Security.md §7). Re-check
# `httpd -S` before and after installing.
#
# TLS: issue the cert first with
#   certbot certonly --webroot -w /var/www/facility-booking -d facility-booking.celestialtech.ca
# (stage the :80 block below first so the ACME challenge can be served).

<VirtualHost *:80>
    ServerName facility-booking.celestialtech.ca

    # Let Let's Encrypt webroot validation/renewal through un-redirected.
    Alias /.well-known/acme-challenge /var/www/facility-booking/.well-known/acme-challenge
    <Directory /var/www/facility-booking/.well-known/acme-challenge>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://facility-booking.celestialtech.ca%{REQUEST_URI} [R=301,L]

    ErrorLog  /var/log/httpd/facility-booking_error.log
    CustomLog /var/log/httpd/facility-booking_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName facility-booking.celestialtech.ca
    DocumentRoot /var/www/facility-booking

    # ---- TLS (Let's Encrypt) ----
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/facility-booking.celestialtech.ca/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/facility-booking.celestialtech.ca/privkey.pem
    # If present, prefer certbot's managed options and drop the two lines below:
    # Include /etc/letsencrypt/options-ssl-apache.conf
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLHonorCipherOrder   off

    # Tell browsers to stick to HTTPS.
    Header always set Strict-Transport-Security "max-age=15768000"

    RewriteEngine On

    # ---- API reverse proxy ----
    # Declared BEFORE the static Alias so /facility-booking/api never resolves to
    # a file. The trailing slashes strip the /facility-booking prefix: an external
    #   /facility-booking/api/...  ->  http://127.0.0.1:8094/api/...
    # so the Go API keeps serving /api/... (FB_BASE_PATH stays empty).
    # X-Forwarded-Proto tells the backend the original request was HTTPS.
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /facility-booking/api/  http://127.0.0.1:8094/api/
    ProxyPassReverse /facility-booking/api/  http://127.0.0.1:8094/api/
    # Generous timeout for waiver/insurance uploads.
    ProxyTimeout 300

    # ---- Static SPA ----
    # Built with Vite base "/facility-booking/", so assets are referenced at
    # /facility-booking/assets/... Map that URL prefix to the docroot and return
    # the app shell for client-side routes via FallbackResource.
    Alias /facility-booking /var/www/facility-booking
    <Directory /var/www/facility-booking>
        Require all granted
        Options -Indexes +FollowSymLinks
        AllowOverride None
        FallbackResource /facility-booking/index.html
    </Directory>

    # Bare domain -> the app.
    RedirectMatch 302 ^/$ /facility-booking/

    # ---- Caching ----
    # Fingerprinted assets are immutable; the HTML shell must never be cached.
    <LocationMatch "^/facility-booking/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Location "/facility-booking/index.html">
        Header set Cache-Control "no-cache"
    </Location>

    ErrorLog  /var/log/httpd/facility-booking_error.log
    CustomLog /var/log/httpd/facility-booking_access.log combined
</VirtualHost>
